<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5 WebP Animated - Picture Tag</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #05070a; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            position: relative;
            background: #111622;
            border: 2px solid #1e293b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        .corner-title {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.85);
            color: #00e5ff;
            border: 1px solid #00e5ff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
            z-index: 10;
        }

        .img-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* Tối ưu render ảnh động WebP hiển thị rõ nét */
        picture, img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .name-tag {
            padding: 8px;
            font-size: 12px;
            background: #0a0e17;
            border-top: 1px solid #1e293b;
            word-break: break-all;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <h2 style="color: #00e5ff; margin-bottom: 20px;">Giao Diện Ô WebP Động Sắc Nét (<picture>)</h2>

    <div class="grid">
        <!-- 42672.webp -->
        <div class="card">
            <span class="corner-title">42672.webp</span>
            <div class="img-container">
                <picture>
                    <source srcset="42672.webp" type="image/webp">
                    <img src="42672.webp" alt="42672.webp">
                </picture>
            </div>
            <div class="name-tag">42672.webp</div>
        </div>
