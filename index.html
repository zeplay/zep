<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện H5 - Ô Nhân Vật & Vật Phẩm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #ffd700;
            margin-bottom: 25px;
            text-align: center;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1000px;
        }

        .card-item {
            position: relative;
            background: radial-gradient(circle, #222733 0%, #0d0f14 100%);
            border: 2px solid #3a4454;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
            transition: transform 0.2s, border-color 0.2s;
        }

        .card-item:hover {
            transform: scale(1.03);
            border-color: #ffd700;
        }

        /* Tên hiển thị ở góc trên bên trái của mỗi ô */
        .corner-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffd700;
            border: 1px solid #ffd700;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 5;
            font-weight: bold;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .img-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: #000000;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Nhãn tên gốc đầy đủ phía dưới ô */
        .original-name {
            width: 100%;
            background-color: #141820;
            border-top: 1px solid #2a3240;
            padding: 8px 6px;
            font-size: 12px;
            color: #e0e0e0;
            text-align: center;
            word-break: break-all; /* Đảm bảo tên dài không bị tràn hay cắt xén */
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <h1>Danh Sách Ô Nhân Vật & Vật Phẩm</h1>

    <div class="grid-container">
        <!-- Item 1 -->
        <div class="card-item">
            <div class="corner-badge">42672.webp</div>
            <div class="img-container">
                <img src="42672.webp" alt="42672.webp">
            </div>
            <div class="original-name">42672.webp</div>
        </div>

            <div class="img-container">
                <img src="fe9c916e-f916-4571-8bea-132191b4489f-1_all_285.gif" alt="fe9c916e-f916-4571-8bea-132191b4489f-1_all_285.gif">
            </div>
            <div class="original-name">fe9c916e-f916-4571-8bea-132191b4489f-1_all_285.gif</div>
        </div>

</html>
